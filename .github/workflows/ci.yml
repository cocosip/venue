name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.27']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests (race detector)
      if: matrix.os != 'windows-latest'
      timeout-minutes: 20
      run: go test -race -coverprofile coverage.txt -covermode atomic -timeout 15m ./...

    # go test -race needs CGO, which is disabled on windows-latest.
    - name: Run tests (no race detector)
      if: matrix.os == 'windows-latest'
      timeout-minutes: 15
      run: go test -coverprofile coverage.txt -covermode atomic -timeout 10m ./...

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.txt
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        cache: true

    # golangci-lint v2.13.1 is built with go1.27, so the CI toolchain is 1.27.
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.1
        args: --timeout=10m

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        cache: true

    - name: Build
      run: go build -v ./...
