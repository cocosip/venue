name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Full history for changelog generation

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        cache: true

    - name: Download dependencies
      run: go mod download

    # CI already gates build, vet, gofmt and whitespace on every push, so a tag
    # that reaches this workflow has passed them. Only the race suite is re-run
    # here: a tag can be cut from a commit that was never pushed to a branch.
    - name: Run tests
      run: go test -race -timeout 15m ./...

    - name: Generate changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        {
          echo "## Changes"
          echo ""
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" --no-merges
          else
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
          fi
          echo ""
        } > CHANGELOG.md

        cat CHANGELOG.md

    # Venue is a library with no main package, so a release publishes no
    # binaries; GitHub attaches the source archives automatically.
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        body_path: CHANGELOG.md
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        generate_release_notes: true
